service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]

extensions:
  healthcheckv2:
    use_v2: true
    http:
  jaeger_query:
    storage:
      traces: clickhouse
  jaeger_storage:
    backends:
      clickhouse:
        clickhouse:
          addresses: [clickhouse:9000]
          database: jaeger
          auth:
            basic:
              username: jaeger
              password: jaeger_local_password
          create_schema: true

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch:
exporters:
  jaeger_storage_exporter:
    trace_storage: clickhouse
